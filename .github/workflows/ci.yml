name: CI

# Runs on every pull request to main, and on pushes to main.
# This is the CI half of the pipeline: lint -> test -> build image -> scan.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build Docker image
              run: docker build -t devops-demo:${{ github.sha }} .

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: devops-demo:${{ github.sha }}
                  format: table
                  ignore-unfixed: true
                  severity: CRITICAL,HIGH
                  exit-code: "0"
